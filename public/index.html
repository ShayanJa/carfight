<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplayer Car Battle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            background: #2d2d2d;
            border: 2px solid #444;
            cursor: crosshair;
            touch-action: none; /* Disable default touch gestures */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
        }

        #playerInfo {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #healthBar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ffaa00, #44ff44);
            transition: width 0.3s ease;
        }

        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            min-width: 200px;
            z-index: 100;
        }

        #leaderboard h3 {
            margin: 0 0 10px 0;
            color: #ffaa00;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }

        #joinForm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
        }

        #joinForm input {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        #joinForm button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #ffaa00;
            color: black;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        #joinForm button:hover {
            background: #ff8800;
        }

        #respawnButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #ff4444;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 200;
            display: none;
        }

        #respawnButton:hover {
            background: #ff6666;
        }

        .minimap {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #555;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="joinForm">
            <h2>Join the Battle!</h2>
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
            <br>
            <button onclick="joinGame()">Start Playing</button>
        </div>

        <div id="ui" style="display: none;">
            <div id="playerInfo">
                <div>Player: <span id="playerNameDisplay"></span></div>
                <div>Score: <span id="playerScore">0</span></div>
                <div>Health:</div>
                <div id="healthBar">
                    <div id="healthFill" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <div id="leaderboard" style="display: none;">
            <h3>🏆 Leaderboard</h3>
            <div id="leaderboardList"></div>
        </div>

        <div id="controls" style="display: none;">
            <div><strong>Controls:</strong></div>
            <div>↑ - Accelerate</div>
            <div>↓ - Brake/Reverse</div>
            <div>← → - Steer</div>
            <div>🚀 SPACE - Shoot Laser</div>
            <div>📱 Mobile: Tap to move, double tap to shoot</div>
            <div><em>Crash into others or shoot them!</em></div>
        </div>

        <button id="respawnButton" onclick="respawn()">Respawn</button>

        <canvas class="minimap" id="minimap" style="display: none;"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
